<!doctype html>
<html lang="en-GB" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5EFE6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nest" />
    <meta name="description" content="The jobs around our home: what needs doing, who's on it, what it costs and how far we've come." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Nest</title>
    <script>
      // Before anything paints, so a dark-mode phone never flashes cream (or the reverse).
      try {
        var look = localStorage.getItem('nest-look') || 'light';
        var dark = look === 'dark' || (look === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (dark) document.querySelector('meta[name=theme-color]').content = '#1F1B18';
      } catch (e) {}
    </script>
    <style>
      html,
      body {
        margin: 0;
        background: #f5efe6;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background: #1f1b18;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
